name: QA PR Review

on:
  pull_request:
    branches:
      - develop
      - main
      - release

jobs:

  qa-review:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Compile Framework
        run: ./gradlew testClasses

      - name: Execute PR Review Engine
        id: review
        continue-on-error: true
        run: ./gradlew pullRequestReview

      - name: Publish PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let body;

            try {
              body = fs.readFileSync(
                'build/pr-review-report.md',
                'utf8'
              );
            } catch (err) {
              body =
  # QA PR Review

  #No fue posible generar el reporte markdown.

  #Revisar logs del job qa-review.`;
  }

  await github.rest.issues.createComment({
owner: context.repo.owner,
repo: context.repo.repo,
issue_number: context.issue.number,
body: body
});

- name: Execute New Test Cases
  if: steps.review.outcome == 'success'
  run: |
    ./gradlew apiTest \
    -Ptags=@TestCase=NEW

- name: Upload Reports
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: qa-review-artifacts
    path: |
      build/pr-review-report.md
      build/reports
      build/karate-reports

- name: Fail Workflow When Review Failed
  if: steps.review.outcome == 'failure'
  run: exit 1